# SentinelAI — Render Blueprint: v4 (clean deployment from this repo)
# Root Directory = backend, single uvicorn instance (in-process task dict in
# backend/app/tasks.py must not be split across workers).

services:
  # ── Backend API ─────────────────────────────────────────────
  - type: web
    name: sentinelai-api-v2
    runtime: python
    plan: standard
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sentinelai-db-v2
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sentinelai-redis-v2
          type: redis
          property: connectionString
      - key: SENTINEL_ENV
        value: production
      - key: CORS_ORIGINS
        value: '["https://sentinelai-web-v2.vercel.app"]'
      - key: REFRESH_TOKEN_COOKIE_SECURE
        value: "true"
      - key: ENABLE_SECURITY_HEADERS
        value: "true"
    healthCheckPath: /api/v1/ready
    autoDeploy: true

  # ── Redis ──────────────────────────────────────────────────
  - type: redis
    name: sentinelai-redis-v2
    plan: free
    ipAllowList: []

# ── PostgreSQL (managed) ──────────────────────────────────────
# fromDatabase requires an entry here; the previous `type: pserv` block was a
# private service and could never satisfy fromDatabase.
databases:
  - name: sentinelai-db-v2
    databaseName: sentinelai
    user: sentinelai
