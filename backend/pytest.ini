[pytest]
markers =
    postgres: runs only when a PostgreSQL TEST_DATABASE_URL is configured
    benchmark: wall-clock performance assertions; excluded from the default run

# Benchmarks assert machine-dependent latency thresholds (p95 < 100ms etc.).
# They fail on a loaded or slow-disk machine for reasons unrelated to code, so
# they are opt-in. Run them explicitly:
#     python -m pytest -m benchmark -q
addopts = -m "not benchmark"
