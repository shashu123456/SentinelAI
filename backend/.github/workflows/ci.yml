name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install black ruff
      - run: python -m black --check app tests
      - run: python -m ruff check app tests

  types-gate:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install mypy
      - run: python scripts/mypy_gate.py
      - upload-artifact:
          name: mypy-output
          path: /tmp/mypy-output.txt

  types-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install mypy
      - run: python -m mypy app > mypy-output.txt || true
      - upload-artifact:
          name: mypy-full-output
          path: mypy-output.txt

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e .
      - run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {repository: shashu123456/sentinelai-web}
      - run: cd frontend && pnpm install && pnpm build

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-setup@v2
      - run: codeql/database init
      - run: codeql/database analyze --format=sonarquq-xml > codeql-report.xml

  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git audit-secrets

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t test .

  deployment-smoke-test:
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - run: docker run test ./api/v1/health
