<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#211831" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SentinelAI" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- SEO -->
    <meta name="description" content="SentinelAI scans an OpenAPI spec, a dependency manifest, or source code with deterministic rules and returns findings with a fix instruction." />
    <meta name="keywords" content="security, application security, SAST, API security, vulnerability scanning, DevSecOps, OWASP" />
    <meta name="author" content="SentinelAI" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SentinelAI — Application Security Intelligence" />
    <meta property="og:description" content="Three scanners, one upload box: OpenAPI, dependencies, and source code." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SentinelAI — Application Security Intelligence" />
    <meta name="twitter:description" content="Three scanners, one upload box: OpenAPI, dependencies, and source files." />
    <meta property="og:site_name" content="SentinelAI" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">


    <title>SentinelAI — Application Security Intelligence</title>

    <!-- Theme is resolved before first paint so there is no light/dark flash. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('sentinelai-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.add(theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#211831' : '#F4F3FF');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register Service Worker for PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (registration) => {
              console.log('SW registered:', registration.scope);
            },
            (error) => {
              console.log('SW registration failed:', error);
            }
          );
        });
      }
    </script>
  </body>
</html>
