name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v --tb=short

      - name: Check imports
        working-directory: backend
        run: python -c "from app.main import app; print('Backend imports OK')"

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Check bundle size
        working-directory: frontend
        run: |
          JS_SIZE=$(stat -f%z dist/assets/index-*.js 2>/dev/null || stat -c%s dist/assets/index-*.js 2>/dev/null)
          CSS_SIZE=$(stat -f%z dist/assets/index-*.css 2>/dev/null || stat -c%s dist/assets/index-*.css 2>/dev/null)
          echo "JS bundle: ${JS_SIZE} bytes"
          echo "CSS bundle: ${CSS_SIZE} bytes"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run SAST on own code
        working-directory: backend
        run: |
          python -c "
          from app.core.sast_engine import run_sast_scan
          result = run_sast_scan('app/')
          print(f'SAST: {len(result.findings)} findings in {result.total_files_scanned} files')
          for f in result.findings[:10]:
              print(f'  [{f.severity}] {f.rule_name} in {f.file_path}:{f.line_number}')
          if len(result.findings) > 10:
              print(f'  ... and {len(result.findings) - 10} more')
          "

      - name: Run dependency scan on own code
        working-directory: backend
        run: |
          python -c "
          from app.core.dep_scanner import run_dep_scan
          result = run_dep_scan('.')
          print(f'Deps: {result.total_dependencies} packages, {len(result.findings)} vulnerabilities')
          for f in result.findings:
              print(f'  [{f.severity}] {f.package} {f.installed_version} - {f.cve_id}')
          "

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: sentinelai-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: false
          tags: sentinelai-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, security-scan]
    if: always()

    steps:
      - name: Report status
        run: |
          echo "Backend: ${{ needs.backend-test.result }}"
          echo "Frontend: ${{ needs.frontend-build.result }}"
          echo "Security: ${{ needs.security-scan.result }}"
          if [ "${{ needs.backend-test.result }}" != "success" ] || [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "CI/CD pipeline failed"
            exit 1
          fi
          echo "CI/CD pipeline succeeded"
