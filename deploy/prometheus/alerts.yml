# SentinelAI — Prometheus Alert Rules

groups:
  - name: sentinelai_alerts
    rules:
      # ── Service Health ────────────────────────────────────────
      - alert: ServiceDown
        expr: up{job="sentinelai-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SentinelAI backend is down"
          description: "Backend has been unreachable for more than 1 minute."

      - alert: HighErrorRate
        expr: rate(sentinelai_http_requests_total{status=~"5.."}[5m]) / rate(sentinelai_http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(sentinelai_http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency (p95 > 2s)"
          description: "p95 latency is {{ $value }}s."

      # ── Resource Usage ───────────────────────────────────────
      - alert: HighMemoryUsage
        expr: sentinelai_process_memory_bytes / (1024 * 1024) > 400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Process memory is {{ $value }}MB (limit: 512MB)."

      - alert: HighCPUUsage
        expr: rate(sentinelai_cpu_usage_seconds_total[5m]) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value | humanizePercentage }}."

      # ── Database ──────────────────────────────────────────────
      - alert: DatabaseDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "Database has been unreachable for more than 1 minute."

      - alert: DatabaseConnectionPoolExhausted
        expr: pg_stat_activity_count > 18
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "{{ $value }} active connections (max: 20)."

      # ── Redis ────────────────────────────────────────────────
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis has been unreachable for more than 1 minute."

      # ── Security ─────────────────────────────────────────────
      - alert: BruteForceDetected
        expr: rate(sentinelai_auth_login_total{status="failure"}[5m]) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Brute force attack detected"
          description: "Login failure rate is {{ $value }}/s."

      - alert: HighFailedLoginRate
        expr: rate(sentinelai_auth_login_total{status="failure"}[10m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated failed login rate"
          description: "Failed login rate is {{ $value }}/s."

      # ── Business ─────────────────────────────────────────────
      - alert: ScanQueueBacklog
        expr: sentinelai_scanner_queue_depth > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scan queue backlog"
          description: "{{ $value }} scans queued."

      - alert: ScanFailureRateHigh
        expr: rate(sentinelai_scanner_scan_total{status="failed"}[10m]) / rate(sentinelai_scanner_scan_total[10m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High scan failure rate"
          description: "Scan failure rate is {{ $value | humanizePercentage }}."
