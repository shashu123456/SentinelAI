# SentinelAI — Alertmanager Configuration

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 5s
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'warning'
      repeat_interval: 6h
    - match:
        alertname: SecurityEvent
      receiver: 'security'
      repeat_interval: 30m

receivers:
  - name: 'default'
    # Configure webhook, email, Slack, or PagerDuty here
    # webhook_configs:
    #   - url: 'http://backend:8000/api/webhooks/alerts'
    #     send_resolved: true

  - name: 'critical'
    # webhook_configs:
    #   - url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'

  - name: 'warning'
    # webhook_configs:
    #   - url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'

  - name: 'security'
    # webhook_configs:
    #   - url: 'http://backend:8000/api/security-events/alerts'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
