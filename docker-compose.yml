# SentinelAI — Docker Compose (Production)
# Full stack: Backend, Frontend, Postgres, Redis, Prometheus, Grafana, Loki, Alertmanager, AI
#
# Usage:
#   docker compose up -d                          # Core services
#   docker compose --profile ai up -d             # + Ollama AI
#   docker compose --profile observability up -d  # + Prometheus, Grafana, Loki
#   docker compose --profile full up -d           # Everything
#
# One-click: curl -sSL https://raw.githubusercontent.com/.../deploy.sh | bash

services:
  # ── Backend API ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://sentinelai:${POSTGRES_PASSWORD:-sentinelai_dev}@postgres:5432/sentinelai
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost","http://localhost:80","http://localhost:3000"]}
      - OLLAMA_URL=http://ollama:11434/api/generate
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
      - SENTINEL_ENV=${SENTINEL_ENV:-production}
      - SENTINEL_VERSION=${SENTINEL_VERSION:-1.2.0}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - REFRESH_TOKEN_COOKIE_SECURE=${REFRESH_TOKEN_COOKIE_SECURE:-true}
      - ENABLE_SECURITY_HEADERS=${ENABLE_SECURITY_HEADERS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sentinelai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/live"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    labels:
      - "sentinelai.service=backend"
      - "sentinelai.health=liveness"

  # ── Frontend (nginx) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sentinelai
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=sentinelai
      - POSTGRES_USER=sentinelai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sentinelai_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    networks:
      - sentinelai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelai -d sentinelai"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - sentinelai
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Backup Service ─────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    entrypoint: /bin/sh
    command: >
      -c "echo 'Backup service started. Run: docker compose exec backup /backup.sh'"
    volumes:
      - backup_data:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=sentinelai
      - POSTGRES_USER=sentinelai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sentinelai_dev}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sentinelai
    profiles:
      - full
      - backup

  # ── Prometheus (observability profile) ──────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    networks:
      - sentinelai
    profiles:
      - observability
      - full
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Grafana (observability profile) ─────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-sentinelai}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    restart: unless-stopped
    networks:
      - sentinelai
    profiles:
      - observability
      - full
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Loki (log aggregation) ─────────────────────────────────
  loki:
    image: grafana/loki:2.9.6
    volumes:
      - ./deploy/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    restart: unless-stopped
    networks:
      - sentinelai
    profiles:
      - observability
      - full
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Alertmanager ───────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    restart: unless-stopped
    networks:
      - sentinelai
    profiles:
      - observability
      - full
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Ollama AI (ai profile) ─────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    restart: unless-stopped
    networks:
      - sentinelai
    profiles:
      - ai
      - full
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  ollama_data:
  backup_data:

networks:
  sentinelai:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
